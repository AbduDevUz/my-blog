<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish | Admin</title>
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="admin-login-page">
    <div class="admin-login-card">
      <div class="admin-login-card__brand">
        <strong>Abdu Dev</strong>
        <span>Admin</span>
      </div>
      <p class="admin-login-card__title">Hisobga kirish</p>
      <form id="login-form" class="admin-form" style="margin-bottom: 0;">
        <div>
          <label class="admin-label" for="login-email">Email</label>
          <input type="email" id="login-email" name="email" class="admin-input" required autocomplete="username">
        </div>
        <div>
          <label class="admin-label" for="login-pass">Parol</label>
          <input type="password" id="login-pass" name="password" class="admin-input" required autocomplete="current-password">
        </div>
        <button type="submit" class="admin-btn admin-btn--primary" style="width: 100%; margin-top: 0.25rem;">Kirish</button>
      </form>
      <p id="login-error" class="admin-alert admin-alert--error" style="margin-top: 1rem; margin-bottom: 0;" hidden></p>
      <p style="text-align: center; margin-top: 1.25rem; margin-bottom: 0;">
        <a href="../index.html" style="color: var(--admin-accent); font-size: 0.875rem; font-weight: 500;">← Saytga qaytish</a>
      </p>
      <p class="admin-hint" style="text-align: center; margin-top: 1rem;">Saytni <code>http://127.0.0.1:…</code> orqali oching.</p>
    </div>
  </div>
  <script type="module" src="../assets/js/admin-login.js"></script>
</body>
</html>
