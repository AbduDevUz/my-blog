<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin kirish | Abdu Dev</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/khan.css">
</head>
<body>
  <main class="l-main" style="padding-top: 2rem;">
    <section class="contact section">
      <h2 class="section-title">Admin</h2>
      <p class="about__text" style="text-align: center; max-width: 28rem; margin: 0 auto 1rem;">
        Email va parol — Supabase da yaratgan foydalanuvchi.
        Saytni <code>http://localhost</code> orqali oching (faylni to‘g‘ridan ochishda login ba’zan ishlamaydi).
      </p>
      <div class="contact__container bd-grid" style="max-width: 400px;">
        <form id="login-form" class="contact__form">
          <input type="email" name="email" class="contact__input" placeholder="Email" required autocomplete="username">
          <input type="password" name="password" class="contact__input" placeholder="Parol" required autocomplete="current-password">
          <button type="submit" class="contact__button button">Kirish</button>
        </form>
        <p id="login-error" class="about__text" style="color: #c0392b; text-align: center;"></p>
        <p class="about__text" style="text-align: center;"><a href="../index.html">Saytga qaytish</a></p>
      </div>
    </section>
  </main>
  <script type="module" src="../assets/js/admin-login.js"></script>
</body>
</html>
